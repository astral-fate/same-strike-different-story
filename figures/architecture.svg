<text x="60" y="494" class="h2">2 · Asking: 8 models × 2 conditions × 3 samples</text>
<rect x="70" y="580" width="250" height="110" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="195.0" y="621.5" class="h3" text-anchor="middle">Prompt in one language</text>
<text x="195.0" y="642.5" class="s" text-anchor="middle">the attacker's, the victim's,</text>
<text x="195.0" y="660.5" class="s" text-anchor="middle">or English</text>
<rect x="390" y="540" width="300" height="80" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.6"/>
<text x="540.0" y="575.5" class="h3" text-anchor="middle">Baseline</text>
<text x="540.0" y="596.5" class="s" text-anchor="middle">the translated prompt only</text>
<rect x="390" y="650" width="300" height="90" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="540.0" y="681.5" class="h3" text-anchor="middle">Language-invariance instruction</text>
<text x="540.0" y="702.5" class="s" text-anchor="middle">fixed English system message:</text>
<text x="540.0" y="720.5" class="s" text-anchor="middle">same answer for every language</text>
<rect x="470" y="638" width="143" height="22" rx="11" fill="#2563EB"/>
<text x="541.6" y="653" class="tag" text-anchor="middle">tested mitigation</text>
