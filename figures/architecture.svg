<rect x="1250" y="995" width="91.4" height="18" rx="4" fill="#2563EB"/>
<text x="1460" y="1009" class="t2b">5.5 pts</text>
<text x="1094" y="1047" class="s">With instruction: 95% CI 0.9–10.5</text>
<text x="1094" y="1085" class="t2b">Narrows the gap, does not close it</text>
