<text x="84" y="905" class="hw">Attribution · primary</text>
<text x="84" y="947" class="s">Share of answers naming the reported attacker</text>
<text x="84" y="978" class="t2">Attacker's language</text>
<rect x="240" y="965" width="200.0" height="18" rx="4" fill="#E2E8F0"/>
<rect x="240" y="965" width="129.4" height="18" rx="4" fill="#C2410C"/>
<text x="450" y="979" class="t2b">64.7%</text>
<text x="84" y="1008" class="t2">Victim's language</text>
<rect x="240" y="995" width="200.0" height="18" rx="4" fill="#E2E8F0"/>
<rect x="240" y="995" width="148.2" height="18" rx="4" fill="#1D4ED8"/>
<text x="450" y="1009" class="t2b">74.1%</text>
<text x="84" y="1038" class="t2">English</text>
<rect x="240" y="1025" width="200.0" height="18" rx="4" fill="#E2E8F0"/>
<rect x="240" y="1025" width="151.8" height="18" rx="4" fill="#64748B"/>
<text x="450" y="1039" class="t2b">75.9%</text>
<text x="84" y="1085" class="t2b">Gap 9.4 points (95% CI 5.7–13.6)</text>
<text x="84" y="1107" class="s">Fixed effects for event, language, model: 9.7 points</text>
<text x="84" y="1127" class="s">Same direction in 8/8 models and 5/5 conflicts</text>
<rect x="565" y="875" width="470" height="280" rx="12" fill="#FFFFFF" stroke="#0E7490" stroke-width="2"/>
<rect x="565" y="875" width="470" height="44" rx="12" fill="#0E7490"/>
<rect x="565" y="905" width="470" height="14" fill="#0E7490"/>
<text x="589" y="905" class="hw">Death tolls · against the controls</text>
<text x="589" y="947" class="s">Language pairs whose tolls differ by 25% or more</text>
<text x="589" y="978" class="t2">Conflict events</text>
<rect x="745" y="965" width="200.0" height="18" rx="4" fill="#E2E8F0"/>
<rect x="745" y="965" width="96.3" height="18" rx="4" fill="#1E293B"/>
<text x="955" y="979" class="t2b">19.3%</text>
<text x="589" y="1008" class="t2">Control disasters</text>
<rect x="745" y="995" width="200.0" height="18" rx="4" fill="#E2E8F0"/>
<rect x="745" y="995" width="39.5" height="18" rx="4" fill="#0E7490"/>
<text x="955" y="1009" class="t2b">7.9%</text>
<text x="589" y="1047" class="s">Fisher p = 0.001</text>
<text x="589" y="1085" class="t2b">No consistent direction</text>
<text x="589" y="1107" class="s">13.8% of cells lower, 15.5% higher in the attacker's language</text>
<text x="589" y="1127" class="s">(Wilcoxon p = 0.11): the GPT-3.5 pattern does not replicate</text>
<rect x="1070" y="875" width="470" height="280" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
<rect x="1070" y="875" width="470" height="44" rx="12" fill="#2563EB"/>
<rect x="1070" y="905" width="470" height="14" fill="#2563EB"/>
