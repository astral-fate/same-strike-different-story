<rect x="760" y="565" width="340" height="150" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="930.0" y="608.5" class="h3" text-anchor="middle">8 models via OpenRouter</text>
<text x="930.0" y="629.5" class="s" text-anchor="middle">GPT-4o-mini · GPT-5.6-Luna · Claude Haiku 5.5</text>
<text x="930.0" y="647.5" class="s" text-anchor="middle">DeepSeek-V3 · Qwen 3.7-Flash · GLM-5.3-Flash</text>
<text x="930.0" y="665.5" class="s" text-anchor="middle">Mistral-Small-24B · Llama-3.1-8B</text>
<text x="930.0" y="683.5" class="s" text-anchor="middle">temperature 0.7 · 3 samples per cell</text>
<path d="M690,580 C725,580 725,620 760,620" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<path d="M690,695 C725,695 725,660 760,660" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1160" y="565" width="190" height="150" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="1255.0" y="617.5" class="h3" text-anchor="middle">6,335 responses</text>
<text x="1255.0" y="638.5" class="s" text-anchor="middle">each appended</text>
<text x="1255.0" y="656.5" class="s" text-anchor="middle">as it returns;</text>
<text x="1255.0" y="674.5" class="s" text-anchor="middle">reruns resume</text>
<rect x="1400" y="565" width="150" height="150" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="1475.0" y="617.5" class="h3" text-anchor="middle">Parser</text>
<text x="1475.0" y="638.5" class="s" text-anchor="middle">native digits</text>
<text x="1475.0" y="656.5" class="s" text-anchor="middle">separators, ranges</text>
<text x="1475.0" y="674.5" class="s" text-anchor="middle">A / B / C / D</text>
<line x1="1100" y1="640" x2="1160" y2="640" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1350" y1="640" x2="1400" y2="640" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="850" width="1520" height="330" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="60" y="834" class="h2">3 · Analysis and what it found</text>
