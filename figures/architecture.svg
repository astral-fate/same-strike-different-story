<rect x="1250" y="965" width="200.0" height="18" rx="4" fill="#E2E8F0"/>
<rect x="1250" y="965" width="157.2" height="18" rx="4" fill="#64748B"/>
<text x="1460" y="979" class="t2b">9.4 pts</text>
<text x="1094" y="1008" class="t2">With instruction</text>
