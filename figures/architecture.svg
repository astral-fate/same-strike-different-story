<rect width="1600" height="1250" fill="#F8FAFC"/>
<text x="60" y="62" class="h1">Same Strike, Different Story: how the measurement works</text>
<text x="60" y="96" class="t">Each conflict incident is asked in the languages of both parties and in English; 6 non-political disasters go through the same pipeline as a noise floor.</text>
<rect x="60" y="114" width="257" height="22" rx="11" fill="#C2410C"/>
<text x="188.6" y="129" class="tag" text-anchor="middle">asked in the attacker's language</text>
<rect x="327.2" y="114" width="242" height="22" rx="11" fill="#1D4ED8"/>
<text x="448.2" y="129" class="tag" text-anchor="middle">asked in the victim's language</text>
<rect x="579.2" y="114" width="67" height="22" rx="11" fill="#64748B"/>
<text x="612.8000000000001" y="129" class="tag" text-anchor="middle">English</text>
<rect x="656.4000000000001" y="114" width="143" height="22" rx="11" fill="#2563EB"/>
<text x="728.0000000000001" y="129" class="tag" text-anchor="middle">tested mitigation</text>
<rect x="809.6000000000001" y="114" width="136" height="22" rx="11" fill="#0E7490"/>
<text x="877.4000000000001" y="129" class="tag" text-anchor="middle">negative control</text>
<rect x="40" y="190" width="1520" height="250" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="60" y="174" class="h2">1 · The instrument: one neutral question in eleven languages</text>
<rect x="70" y="220" width="300" height="100" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="220.0" y="256.5" class="h3" text-anchor="middle">22 conflict incidents</text>
<text x="220.0" y="277.5" class="s" text-anchor="middle">5 conflicts · place, date and type only</text>
<text x="220.0" y="295.5" class="s" text-anchor="middle">19 attributed · 3 contested</text>
<rect x="70" y="335" width="300" height="80" rx="10" fill="#ECFEFF" stroke="#0E7490" stroke-width="1.6"/>
<text x="220.0" y="370.5" class="h3" text-anchor="middle">6 control disasters</text>
<text x="220.0" y="391.5" class="s" text-anchor="middle">no partisan side · asked in all 11 languages</text>
<rect x="430" y="250" width="300" height="130" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="580.0" y="292.5" class="h3" text-anchor="middle">One English template</text>
<text x="580.0" y="313.5" class="s" text-anchor="middle">deaths · civilian share · responsible</text>
<text x="580.0" y="331.5" class="s" text-anchor="middle">A) party A   B) party B</text>
<text x="580.0" y="349.5" class="s" text-anchor="middle">C) disputed or unclear   D) someone else</text>
<rect x="790" y="250" width="230" height="130" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="905.0" y="292.5" class="h3" text-anchor="middle">Translate</text>
<text x="905.0" y="313.5" class="s" text-anchor="middle">Claude Haiku 5.5</text>
<text x="905.0" y="331.5" class="s" text-anchor="middle">10 languages</text>
<text x="905.0" y="349.5" class="s" text-anchor="middle">answer labels kept in Latin</text>
<rect x="1080" y="250" width="250" height="130" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="1205.0" y="292.5" class="h3" text-anchor="middle">Back-translate + audit</text>
<text x="1205.0" y="313.5" class="s" text-anchor="middle">GPT-4o-mini</text>
<text x="1205.0" y="331.5" class="s" text-anchor="middle">104/104 pass</text>
<text x="1205.0" y="349.5" class="s" text-anchor="middle">equivalent · no loaded terms</text>
<rect x="1390" y="250" width="160" height="130" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
<text x="1470.0" y="301.5" class="h3" text-anchor="middle">132 prompts</text>
<text x="1470.0" y="322.5" class="s" text-anchor="middle">frozen in</text>
<text x="1470.0" y="340.5" class="s" text-anchor="middle">data/prompts.jsonl</text>
